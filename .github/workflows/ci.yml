name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # net8.0-windows target: the build itself needs a Windows runner.
    # No Solid Edge installation is required — the tests cover pure logic only.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore solidedge-mcp.sln

      - name: Build
        run: dotnet build solidedge-mcp.sln -c Release --no-restore

      - name: Test
        run: dotnet test solidedge-mcp.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
